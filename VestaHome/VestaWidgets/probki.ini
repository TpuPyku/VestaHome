# VestaHome widget: Yandex traffic score for a city, with no script - VestaHome fetches the url (HTTPS) every 5 min
# and takes the fields out by their markers. The city: region=<id> in the url:
#   213 Москва, 2 Санкт-Петербург, 51 Самара, 43 Казань, 47 Нижний Новгород, 54 Екатеринбург, 65 Новосибирск,
#   35 Краснодар, 39 Ростов-на-Дону, 172 Уфа, 66 Омск, 193 Воронеж, 38 Волгоград, 11 Рязань
#   (Тольятти, 240: Яндекс не считает баллы - «—»). An unofficial address (Yandex.Bar's): it may stop working.
title=Пробки
icon=car
url=https://export.yandex.ru/bar/reginfo.xml?region=51
every=300
value.from=<level>|</level>
unit=балл.
text.from=<hint lang="ru">|</hint>
text2.from=<time>|</time>
text2=Яндекс Пробки · %s
state.from=<icon>|</icon>
refresh=10
tap=\SDMMC\OSMapsCE\OSMapsCE.exe
