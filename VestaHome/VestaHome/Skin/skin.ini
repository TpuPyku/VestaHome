; VestaHome skin: the Skin folder next to VestaHome.exe. Read once at start.
; [colors]: RRGGBB. [images]: PNG files in this folder, transparency supported.
; Icons are square and drawn scaled: 60 px on tiles, 40 px on buttons, other sizes on the
; other screens, where they are tinted with that screen's colour unless it is the text colour.
; Optional: <name>_down = a separate pressed picture (otherwise the icon is tinted dark),
;   background = an 800 x 480 picture for the main menu instead of the built-in mosaic,
;   saver = the screen saver's 800 x 480 picture (kept only while it shows),
;     saver.png - design 0.6 (skin/make_saver.py), saver2.png - the previous one (the headlights),
;   tile = a picture (PNG or JPG, 8..400 px a side) repeated over the background of every
;   screen instead of the built-in triangles (the main menu too, unless background is given).
; Each picture costs memory: a 64 x 64 icon 16 KB, the background 750 KB.
; A missing line or file falls back to the built-in drawing.

[colors]
ink     = 0E1013   ; background
panel   = 1A1D22   ; cards, tiles, widgets (no borders)
line    = 2A2F37   ; separators, bar tracks
text    = F5F3EE   ; main text, built-in icons
muted   = AAB0B8   ; secondary text
dim     = 6C727C   ; inactive text
accent  = FF6B1A   ; pressed button, active mode, headings
facet   = C24A0B   ; tile corner
mosaic1 = 0E0F12   ; built-in background triangles (unused with a background picture)
mosaic2 = 14161A
mosaic3 = 17191D

